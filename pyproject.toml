[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brbbq"
version = "0.2.0"
description = "Reproducible bilingual Brazilian BBQ benchmark"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "accelerate>=1.0,<2",
  "matplotlib>=3.3",
  "numpy>=1.24,<2",
  "pandas>=1.2",
  "pyarrow>=17",
  "PyYAML>=6",
  "safetensors>=0.5",
  "sentencepiece>=0.2",
  "torch>=2.4,<3",
  "transformers>=4.46,<5",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
brbbq = "brbbq.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py38"
