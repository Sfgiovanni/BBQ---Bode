  prompt_style: simple
  top_logprobs: 20
  max_concurrency: 16
  request_timeout: 60
  max_attempts: 6
  dtype: null
  device_map: null
  config_path: configs/models/sabia.yaml
inference:
  batch_size: 32
  batch_candidates:
  - 32
  checkpoint_every: 100
  audit_per_language: 50
  max_new_tokens_audit: 8
  scoring_method: first_token_logprob
  do_sample: false
  resume: true
metrics:
  bootstrap_samples: 1000
  confidence_level: 0.95
  cluster_key: semantic_pair_id
paths:
  categories: questions/categories_bilingual_extended.yaml
  scenarios: questions/scenarios_bilingual.jsonl
  results_root: results/runs
