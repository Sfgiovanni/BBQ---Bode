experiment:
  name: bilingual_sabia_extended
  seed: 42
  languages:
  - pt
  - en
  categories: all
  templates_per_category: 30
  pairs_per_template: null
  conditions_per_pair: 4
  permutations: 3
  expected_logical_per_language: 6120
  expected_logical_total: 12240
  expected_expanded_total: 36720
model:
  adapter: maritaca_api
  model_name: sabiazinho-4
