experiment:
  name: bilingual_bode
  seed: 42
  languages:
  - pt
  - en
  categories: all
  templates_per_category: 30
  pairs_per_template: 3
  conditions_per_pair: 4
  permutations: 3
  expected_logical_per_language: 3240
  expected_logical_total: 6480
  expected_expanded_total: 19440
model:
  adapter: bode_alpaca
  model_name: recogna-nlp/bode-7b-alpaca-pt-br-no-peft
  revision: null
  tokenizer_name: recogna-nlp/bode-7b-alpaca-pt-br-no-peft
  tokenizer_revision: null
  prompt_style: alpaca
  dtype: float16
  device_map: auto
  trust_remote_code: false
  low_cpu_mem_usage: true
  config_path: configs/models/bode.yaml
inference:
  batch_size: 8
  batch_candidates:
  - 16
  - 8
  - 4
  - 2
  - 1
  checkpoint_every: 100
  audit_per_language: 50
  max_new_tokens_audit: 8
  scoring_method: first_token_logprob
  do_sample: false
  resume: true
metrics:
  bootstrap_samples: 1000
  confidence_level: 0.95
  cluster_key: semantic_pair_id
paths:
  categories: data/categories_bilingual.yaml
  scenarios: data/scenarios_bilingual.jsonl
  results_root: results/runs
