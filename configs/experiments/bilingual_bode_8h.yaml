experiment:
  name: bilingual_bode
  seed: 42
  languages: [pt, en]
  categories: all
  templates_per_category: 30
  pairs_per_template: 3
  conditions_per_pair: 4
  permutations: 3
  expected_logical_per_language: 3240
  expected_logical_total: 6480
  expected_expanded_total: 19440
model:
  config: configs/models/bode.yaml
inference:
  batch_size: auto
  batch_candidates: [16, 8, 4, 2, 1]
  checkpoint_every: 100
  audit_per_language: 50
  max_new_tokens_audit: 8
  scoring_method: first_token_logprob
  do_sample: false
  resume: true
metrics:
  bootstrap_samples: 1000
  confidence_level: 0.95
  cluster_key: semantic_pair_id
paths:
  categories: questions/categories_bilingual.yaml
  scenarios: questions/scenarios_bilingual.jsonl
  results_root: results/runs
